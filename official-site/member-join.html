<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>회원가입 · 대한과일협회</title>
  <link rel="stylesheet" href="member-style.css" />
</head>
<body>
  <nav class="m-nav">
    <div class="m-nav__inner">
      <a class="m-nav__brand" href="/"><span>대한과일협회</span><span class="m-nav__brand-en">KFA</span></a>
      <div class="m-nav__crumbs"><a href="/">홈</a><span class="sep">›</span><span>회원</span><span class="sep">›</span><span>회원가입</span></div>
      <div class="m-nav__util"><a href="/member-login">로그인</a><a href="/member-join" class="is-active">회원가입</a><a href="/member-mypage">마이페이지</a></div>
    </div>
  </nav>

  <main class="m-page m-page--wide">
    <div style="max-width: 920px; width: 100%;">
      <div class="m-head">
        <p class="m-head__eyebrow">KFA MEMBER</p>
        <h1>대한과일협회와<br />함께해 주세요.</h1>
        <p class="m-head__lead">가입 신청 후 관리자 승인 절차를 거쳐 정회원으로 등록됩니다.</p>
      </div>

      <section class="m-card m-card--wide">
        <div class="config-box">
          <label for="gas-url">Apps Script 배포 URL</label>
          <input id="gas-url" type="url" />
          <button id="save-gas-url" type="button">저장</button>
          <div id="config-msg" class="msg"></div>
        </div>

        <form id="join-form" class="m-form m-form--two" autocomplete="on">
          <div class="m-field">
            <label>성명</label>
            <input name="name" type="text" autocomplete="name" required placeholder="홍길동" />
          </div>
          <div class="m-field">
            <label>연락처</label>
            <input name="phone" type="tel" autocomplete="tel" required placeholder="010-0000-0000" />
          </div>
          <div class="m-field m-field--full">
            <label>이메일</label>
            <input name="email" type="email" autocomplete="email" required placeholder="hello@example.com" />
            <span class="m-field__hint">로그인 ID로 사용되며 승인 결과를 안내드립니다.</span>
          </div>
          <div class="m-field">
            <label>비밀번호</label>
            <input name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="8자 이상" />
          </div>
          <div class="m-field">
            <label>비밀번호 확인</label>
            <input name="password2" type="password" autocomplete="new-password" minlength="8" required placeholder="동일하게 입력" />
          </div>
          <div class="m-field">
            <label>업체명 <span style="color: var(--ink-4); font-weight: 400;">(선택)</span></label>
            <input name="businessName" type="text" placeholder="예: ○○청과" />
          </div>
          <div class="m-field">
            <label>업종</label>
            <select name="businessType">
              <option value="청과 소매">청과 소매</option>
              <option value="과일 유통">과일 유통</option>
              <option value="교육기관">교육기관</option>
              <option value="복지기관">복지기관</option>
              <option value="기타">기타</option>
            </select>
          </div>
          <div class="m-field">
            <label>지역</label>
            <input name="region" type="text" placeholder="예: 서울 송파구" />
          </div>
          <div class="m-field">
            <label>가입 목적</label>
            <select name="role">
              <option value="과일코디네이터 교육">과일코디네이터 교육</option>
              <option value="협회 회원">협회 회원</option>
              <option value="기관 협력">기관 협력</option>
              <option value="ESG 프로그램">ESG 프로그램</option>
            </select>
          </div>
          <div class="m-field m-field--full">
            <button type="submit" class="m-btn m-btn--primary">회원가입 신청</button>
          </div>
        </form>

        <div id="join-msg" class="msg"></div>
        <div class="m-notice">
          <strong>개인정보 보호.</strong> 비밀번호는 브라우저에서 해시 처리 후 전송됩니다.
          관리자 승인은 영업일 기준 1-2일 소요될 수 있습니다.
        </div>
      </section>

      <div class="m-links">
        <a href="/member-login">이미 회원이신가요? 로그인</a>
        <a href="/">홈으로</a>
      </div>
    </div>
  </main>

  <script src="assets/kfa-member.js"></script>
</body>
</html>
