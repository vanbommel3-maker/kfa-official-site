<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TSTC · 대한과일협회</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div data-chrome="nav"></div>

  <main>
    <header class="kfa-page-head">
      <p class="kfa-eyebrow">TSTC</p>
      <h1 class="kfa-page-head__h">
        감각을 읽습니다.
      </h1>
      <p class="kfa-page-head__sub">
        Taste · Scent · Texture · Color.
      </p>
      <div class="kfa-page-head__cta">
        <a href="files/tstc진단프로그램.html" class="kfa-link-arrow">당신의 감각 들여다보기</a>
      </div>
    </header>

    <div class="kfa-senses">
      <article class="kfa-sense is-left">
        <div class="kfa-sense__letter">T</div>
        <div class="kfa-sense__copy">
          <p class="kfa-sense__en">Taste · <span class="ko">맛</span></p>
          <p class="kfa-sense__line">어떤 단맛은 깊고,<br />어떤 단맛은 가볍습니다.</p>
        </div>
      </article>

      <article class="kfa-sense is-right">
        <div class="kfa-sense__letter">S</div>
        <div class="kfa-sense__copy">
          <p class="kfa-sense__en">Scent · <span class="ko">향</span></p>
          <p class="kfa-sense__line">향은 첫인상이고,<br />기억의 입구입니다.</p>
        </div>
      </article>

      <article class="kfa-sense is-left">
        <div class="kfa-sense__letter">T</div>
        <div class="kfa-sense__copy">
          <p class="kfa-sense__en">Texture · <span class="ko">식감</span></p>
          <p class="kfa-sense__line">먹는 경험은<br />입 안에서 일어납니다.</p>
        </div>
      </article>

      <article class="kfa-sense is-right">
        <div class="kfa-sense__letter">C</div>
        <div class="kfa-sense__copy">
          <p class="kfa-sense__en">Color · <span class="ko">색</span></p>
          <p class="kfa-sense__line">보기 좋은 과일과<br />손이 가는 과일은 다릅니다.</p>
        </div>
      </article>
    </div>
  </main>

  <div data-chrome="footer"></div>
  <script src="shared.js"></script>
</body>
</html>
