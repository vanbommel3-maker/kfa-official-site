/* Claude TSTC transplant: typography, profile grid, and reading rhythm. */
:root{
  --font-sans:"Pretendard Variable","Pretendard","Inter",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Helvetica Neue",Helvetica,Arial,"Noto Sans KR",system-ui,sans-serif;
  --font-display:"Pretendard Variable","Pretendard","Inter","Helvetica Neue","Apple SD Gothic Neo",system-ui,sans-serif;
  --font-serif:"Noto Serif KR","Iowan Old Style","Apple Garamond",Georgia,"Times New Roman",serif;
  --font-mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --ink-1:#1c1916;
  --ink-2:#3d3833;
  --ink-3:#6b6157;
  --ink-4:#968b7f;
  --ink-5:#d9d2c7;
  --surface-0:#fff;
  --surface-1:#faf7f3;
  --brand:#a85a3e;
  --brand-dk:#7a3f29;
  --brand-lt:#f4ebe4;
}
body{font-family:var(--font-sans);font-size:17px;line-height:1.47;background:var(--surface-1);color:var(--ink-1);font-feature-settings:"ss01","ss02","cv01","cv02","cv03"}
#sl{min-height:100vh;text-align:center}
.landing-shell{display:block;width:min(760px,100%);min-height:auto;padding:78px 0 112px}
.landing-copy{text-align:center}
.lorg,.panel-eyebrow,.qtag{font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--ink-4);text-transform:uppercase}
.ltit{font-family:var(--font-serif);font-size:52px;font-weight:400;line-height:1.32;color:var(--ink-1);margin:24px 0 32px}
.lsub{font-size:14px;color:var(--ink-3);letter-spacing:.04em;text-transform:none}
.lgold{max-width:620px;margin:0 auto 64px;color:var(--ink-3);font-size:14px;line-height:1.8;letter-spacing:.04em}
.landing-panel{max-width:520px;margin:0 auto;text-align:center}
.panel-title{font-family:var(--font-serif);font-size:24px;font-weight:400;line-height:1.5;color:var(--ink-1);margin:0 0 28px}
.lbtns{border:0;align-items:center;gap:14px}
.lbtn{width:auto;min-width:190px;border:0;border-radius:999px;background:var(--ink-1);color:var(--surface-0);padding:14px 34px;text-align:center;display:inline-flex;flex-direction:column;align-items:center;transition:opacity .2s,transform .2s}
.lbtn:hover{background:var(--ink-1);color:var(--surface-0);transform:scale(.98);opacity:.88}
.lbtn+.lbtn{background:transparent;color:var(--ink-2);border:1px solid var(--ink-5)}
.lbtn+.lbtn:hover{background:transparent;color:var(--ink-1);border-color:var(--ink-3)}
.lbtag,.lbinfo{display:none}
.lbname{font-size:16px;font-weight:500;line-height:1.4}
.lfoot{margin-top:28px;text-align:center;color:var(--ink-4);font-size:12px}
.hd{background:rgba(250,247,243,.84);border-bottom:1px solid rgba(217,210,199,.72)}
.hd-sec{font-family:var(--font-mono);font-weight:500;color:var(--ink-4)}
.hd-cnt{font-family:var(--font-mono);font-size:12px;color:var(--ink-4)}
#pbar2{background:rgba(250,247,243,.86);border-bottom:1px solid rgba(217,210,199,.72)}
.qb{max-width:760px;padding:88px 32px 132px;text-align:center}
.qscreen .qtag{display:block;margin:0 0 28px}
.qscreen .qtit,.q-profile .qtit,.q-sensory .qtit{
  font-family:var(--font-serif);
  font-size:38px!important;
  font-weight:400;
  line-height:1.32;
  color:var(--ink-1);
  margin:0 0 56px;
}
.qscreen .qdsc{max-width:560px;margin:0 auto 48px;color:var(--ink-3);font-size:15px;line-height:1.75}
.opts{border-top:1px solid var(--ink-5)}
.opt,.mopt{position:relative;display:block;width:100%;padding:22px 8px;border:0;border-bottom:1px solid var(--ink-5);background:transparent;color:var(--ink-2);text-align:left;font-size:17px;font-weight:400;transition:color .22s,padding-left .32s,background-color .2s}
.opt::after,.mopt::after{
  content:"??;
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%) translateX(-8px);
  opacity:0;
  color:var(--brand);
  font-size:18px;
  transition:opacity .22s,transform .32s;
}
.opt:hover,.opt.sel,.mopt:hover,.mopt.msel{color:var(--ink-1);padding-left:18px;background:transparent;transform:none}
.opt:hover::after,.opt.sel::after,.mopt:hover::after,.mopt.msel::after{opacity:1;transform:translateY(-50%) translateX(0)}
.onum{display:none}
.otxt,.mt{font-size:17px;font-weight:400;line-height:1.48}
.osub,.ms{font-size:13px;line-height:1.55;color:var(--ink-4);margin-top:6px}
.mchk{display:none}
.mnote{font-family:var(--font-sans);color:var(--ink-4);font-size:13px;font-weight:400;margin:-32px 0 26px}
.cgrid{border:1px solid var(--ink-5);border-top:1px solid var(--ink-5);gap:0;background:var(--surface-0)}
.copt{border:0;border-right:1px solid var(--ink-5);border-bottom:1px solid var(--ink-5);background:var(--surface-0);color:var(--ink-2);padding:18px 12px;font-size:14px;box-shadow:none;transition:background-color .2s,color .2s}
.copt:hover,.copt.sel{background:var(--brand-lt);color:var(--brand-dk);transform:none}
.region-grid{display:grid;grid-template-columns:repeat(4,1fr)}
.region-grid .copt:nth-child(4n){border-right:0}
.region-grid .copt:nth-last-child(-n+1){border-bottom:0}
.q-chips .cgrid{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;border:0;background:transparent}
.q-chips .copt{min-width:78px;border:1px solid var(--ink-5);border-radius:999px;background:transparent;padding:15px 22px;font-size:16px}
.q-chips .copt:hover,.q-chips .copt.sel{background:var(--ink-1);border-color:var(--ink-1);color:#fff}
.coname{font-size:inherit;font-weight:500}
.cosub{display:none}
.pgrid{gap:0;border:1px solid var(--ink-5);background:var(--surface-0)}
.pbtn{border:0;border-right:1px solid var(--ink-5);background:var(--surface-0);padding:28px 18px;box-shadow:none}
.pbtn:last-child{border-right:0}
.pbtn:hover,.pbtn.sel{background:var(--brand-lt);border-color:var(--ink-5);color:var(--brand-dk);transform:none}
.pname{font-size:17px;font-weight:500}
.pex{font-size:13px;color:var(--ink-4)}
.srow{gap:0;border:1px solid var(--ink-5);border-right:0}
.sbtn{border:0;border-right:1px solid var(--ink-5);background:var(--surface-0)}
.sbtn:hover,.sbtn.sel{background:var(--brand);color:#fff}
.nbtn,.rcta{font-family:var(--font-sans);font-weight:500;background:var(--ink-1)}
#sc .qb,#so .qb{max-width:720px;text-align:center}
#sc .qtit,#so .qtit{font-family:var(--font-serif);font-size:34px!important;font-weight:400}
.flabel{text-align:left;display:block;font-family:var(--font-mono);font-weight:500}
.mcard{text-align:left;background:var(--surface-0)}
.rhero{text-align:center}
.rtype,.report-section h3{font-family:var(--font-serif);font-weight:400}
@media(max-width:780px){
  .landing-shell{padding:70px 0 96px}
  .ltit{font-size:38px}
  .lgold{margin-bottom:48px}
  .lbtns{gap:12px}
  .lbtn{width:100%}
  .qb{padding:72px 22px 96px}
  .qscreen .qtit,.q-profile .qtit,.q-sensory .qtit{font-size:30px!important;margin-bottom:42px}
  .region-grid{grid-template-columns:repeat(3,1fr)!important}
  .region-grid .copt:nth-child(4n){border-right:1px solid var(--ink-5)}
  .region-grid .copt:nth-child(3n){border-right:0}
  .pgrid{grid-template-columns:1fr}
  .pbtn{border-right:0;border-bottom:1px solid var(--ink-5)}
  .pbtn:last-child{border-bottom:0}
}
@media(max-width:420px){
  .ltit{font-size:33px}
  .qscreen .qtit,.q-profile .qtit,.q-sensory .qtit{font-size:26px!important}
  .region-grid{grid-template-columns:repeat(2,1fr)!important}
  .region-grid .copt:nth-child(3n){border-right:1px solid var(--ink-5)}
  .region-grid .copt:nth-child(2n){border-right:0}
}

</style>

(function(){

function submitResult(payload) {
  if (!GAS_URL) return;  // URL 誘몄꽕????議곗슜???섏뼱媛?  try {
    payload = payload || {};
    payload.savedAt = payload.savedAt || new Date().toISOString();
    var body = JSON.stringify(payload);
    fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: body
    }).catch(function(){
      if (!navigator.sendBeacon) return;
      try {
        navigator.sendBeacon(GAS_URL, new Blob([body], {type: 'text/plain;charset=utf-8'}));
      } catch(e) {}
    });
  } catch(e) {}
}
