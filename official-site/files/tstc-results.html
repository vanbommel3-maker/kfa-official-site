<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSTC 결과 대시보드 — 대한과일협회</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Apple SD Gothic Neo','맑은 고딕',sans-serif;background:#F2F2F0;color:#111;font-size:14px}
:root{--g:#1B3A2D;--g2:#2D6A4F;--gd:#D4A843;--lc:#F4F9F6;--bc:#E8F4EE;--bd:#D4EDDA;--red:#C62828}

/* 헤더 */
.site-hd{background:var(--g);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hd-brand{display:flex;align-items:center;gap:10px}
.hd-line{width:3px;height:36px;background:var(--gd)}
.hd-txt h1{font-size:16px;font-weight:700;color:#fff}
.hd-txt p{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.1em;text-transform:uppercase}
.hd-right{display:flex;align-items:center;gap:8px}
.hd-btn{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);color:#fff;padding:7px 16px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
.hd-btn:hover{background:rgba(255,255,255,.15)}
.hd-btn.primary{background:var(--gd);border-color:var(--gd);color:var(--g);font-weight:700}

/* URL 설정 배너 */
.url-banner{display:none;background:#fff3cd;border-bottom:2px solid var(--gd);padding:12px 28px;align-items:center;gap:12px}
.url-banner.ok{background:var(--lc);border-color:var(--bd)}
.url-icon{font-size:16px}
.url-msg{flex:1;font-size:13px;color:#555}
.url-input{flex:2;border:1.5px solid #ddd;padding:8px 14px;font-size:13px;outline:none;font-family:inherit}
.url-input:focus{border-color:var(--g)}
.url-save{background:var(--g);color:#fff;border:none;padding:8px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}

/* 통계 카드 */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px 28px 0}
.stat-card{background:#fff;border:1px solid #e0e0e0;padding:18px 20px}
.stat-label{font-size:10px;letter-spacing:.1em;color:#888;text-transform:uppercase;margin-bottom:8px}
.stat-num{font-size:32px;font-weight:800;color:var(--g);line-height:1}
.stat-sub{font-size:11px;color:#aaa;margin-top:4px}
.stat-card.gold{border-left:3px solid var(--gd)}
.stat-card.green{border-left:3px solid var(--g2)}

/* 필터 바 */
.filter-bar{background:#fff;border-top:1px solid #e0e0e0;border-bottom:1px solid #e0e0e0;padding:12px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.f-label{font-size:11px;font-weight:700;color:#888;letter-spacing:.08em;text-transform:uppercase}
.f-sel{border:1.5px solid #e0e0e0;padding:7px 12px;font-size:12px;font-family:inherit;outline:none;background:#fff;cursor:pointer}
.f-sel:focus{border-color:var(--g)}
.f-clear{background:none;border:1.5px solid #e0e0e0;padding:7px 14px;font-size:12px;cursor:pointer;color:#888;font-family:inherit}
.f-clear:hover{border-color:var(--g);color:var(--g)}
.f-count{margin-left:auto;font-size:12px;color:#888}
.f-count strong{color:var(--g);font-weight:700}

/* 테이블 영역 */
.table-wrap{padding:0 28px 28px}
.table-actions{display:flex;align-items:center;gap:8px;padding:12px 0 8px}
.sel-count{font-size:12px;color:var(--g2);font-weight:600}
.act-btn{background:var(--g);color:#fff;border:none;padding:8px 20px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.act-btn:hover{background:var(--g2)}
.act-btn:disabled{background:#ccc;cursor:not-allowed}
.act-btn.outline{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.act-btn.outline:hover{background:var(--lc)}

.tbl{width:100%;border-collapse:collapse;background:#fff}
.tbl th{background:var(--g);color:#fff;padding:10px 12px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;border-right:1px solid rgba(255,255,255,.1)}
.tbl th:last-child{border-right:none}
.tbl th input{width:16px;height:16px;cursor:pointer;accent-color:var(--gd)}
.tbl td{padding:10px 12px;border-bottom:1px solid #f0f0f0;white-space:nowrap;font-size:13px;vertical-align:middle}
.tbl tr:hover td{background:#fafafa}
.tbl tr.selected td{background:var(--lc)}
.tbl td input{width:16px;height:16px;cursor:pointer;accent-color:var(--g)}
.code-badge{display:inline-block;background:var(--g);color:var(--gd);font-size:11px;font-weight:800;padding:3px 10px;letter-spacing:.08em}
.type-badge{font-size:11px;color:var(--g2);font-weight:600}
.view-btn{background:none;border:1.5px solid var(--g2);color:var(--g2);padding:4px 12px;font-size:11px;cursor:pointer;font-family:inherit;transition:.15s}
.view-btn:hover{background:var(--g2);color:#fff}
.empty{text-align:center;padding:60px 20px;color:#aaa;font-size:14px}
.loading{text-align:center;padding:60px 20px;color:var(--g2);font-size:14px}

/* 리포트 패널 */
#report-panel{position:fixed;top:0;right:-520px;width:520px;height:100vh;background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.12);z-index:200;transition:right .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;display:flex;flex-direction:column}
#report-panel.open{right:0}
.rp-hd{background:var(--g);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:1}
.rp-hd h2{font-size:15px;font-weight:700;color:#fff}
.rp-close{background:none;border:none;color:rgba(255,255,255,.6);font-size:20px;cursor:pointer;padding:4px}
.rp-body{padding:24px;flex:1}
.rp-code{font-size:56px;font-weight:800;color:var(--gd);line-height:1;letter-spacing:0;text-align:center;margin-bottom:4px}
.rp-type{text-align:center;font-size:16px;font-weight:700;color:var(--g);margin-bottom:20px}
.rp-sec{margin-bottom:20px}
.rp-sec-title{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--g2);text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1.5px solid var(--bd)}

/* 레이더 차트 */
.radar-wrap{display:flex;justify-content:center;margin-bottom:8px}
.axis-labels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ax-chip{background:var(--lc);border:1px solid var(--bd);padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.ax-key{font-size:11px;font-weight:700;color:var(--g)}
.ax-val{font-size:13px;font-weight:700;color:var(--gd)}
.ax-dir{font-size:10px;color:var(--g2);font-weight:600}

/* 바 차트 */
.bar-item{margin-bottom:10px}
.bar-top{display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px}
.bar-name{font-weight:600;color:#111}
.bar-pct{color:var(--gd);font-weight:700}
.bar-bg{height:8px;background:#e8e8e8;border-radius:4px}
.bar-fill{height:100%;background:var(--g);border-radius:4px;transition:width 1s}

/* 프로필 칩 */
.profile-chips{display:flex;gap:6px;flex-wrap:wrap}
.p-chip{background:#eee;padding:4px 10px;font-size:11px;color:#555;border-radius:0}

/* 추천과일 */
.fruit-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0}
.fruit-item:last-child{border:none}
.fruit-rank{width:24px;height:24px;background:var(--g);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fruit-name{font-size:13px;font-weight:500}

/* 설명 */
.desc-text{font-size:13px;color:#444;line-height:1.8;white-space:pre-line}

/* 복수 선택 리포트 */
.bulk-stat{background:var(--lc);border:1px solid var(--bd);padding:14px 16px;margin-bottom:10px}
.bulk-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px}
.bulk-row:last-child{margin-bottom:0}
.bl{color:#888}.bv{font-weight:700;color:var(--g)}

/* 반응형 */
@media(max-width:900px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  #report-panel{width:100%;right:-100%}
}
</style>
</head>
<body>

<!-- 헤더 -->
<div class="site-hd">
  <div class="hd-brand">
    <div class="hd-line"></div>
    <div class="hd-txt">
      <h1>TSTC 결과 대시보드</h1>
      <p>Korea Fruit Association · 대한과일협회</p>
    </div>
  </div>
  <div class="hd-right">
    <button class="hd-btn" onclick="loadData()">새로고침</button>
    <button class="hd-btn primary" id="report-btn" disabled onclick="openBulkReport()">선택 리포트</button>
  </div>
</div>

<!-- URL 배너 -->
<div class="url-banner" id="url-banner">
  <span class="url-icon">⚙️</span>
  <span class="url-msg">Apps Script URL을 입력해야 데이터를 불러올 수 있습니다.</span>
  <input class="url-input" id="gas-url-input" placeholder="https://script.google.com/macros/s/..." value="https://script.google.com/macros/s/AKfycbwbC6MtkfASDi1vSmmOYdAOCpOMHBabno5jpUwFm8tIppntikE2bUqUfi1ITFYoATS0Fw/exec" oninput="checkUrl()">
  <button class="url-save" onclick="saveUrl()">저장 · 불러오기</button>
</div>

<!-- 통계 카드 -->
<div class="stats-row">
  <div class="stat-card gold">
    <div class="stat-label">총 응답 수</div>
    <div class="stat-num" id="st-total">-</div>
    <div class="stat-sub">누적 검사 완료</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">오늘 응답</div>
    <div class="stat-num" id="st-today">-</div>
    <div class="stat-sub" id="st-today-date">-</div>
  </div>
  <div class="stat-card green">
    <div class="stat-label">최다 유형</div>
    <div class="stat-num" style="font-size:22px" id="st-top-code">-</div>
    <div class="stat-sub" id="st-top-name">-</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">고급형 비율</div>
    <div class="stat-num" id="st-premium">-</div>
    <div class="stat-sub">일반형 대비</div>
  </div>
</div>

<!-- 필터 바 -->
<div class="filter-bar">
  <span class="f-label">필터</span>
  <select class="f-sel" id="f-code" onchange="applyFilter()">
    <option value="">TSTC코드 전체</option>
    <option>RACV</option><option>RACN</option><option>RASV</option><option>RASN</option>
    <option>RPCV</option><option>RPCN</option><option>RPSV</option><option>RPSN</option>
    <option>MACV</option><option>MACN</option><option>MASV</option><option>MASN</option>
    <option>MPCV</option><option>MPCN</option><option>MPSV</option><option>MPSN</option>
  </select>
  <select class="f-sel" id="f-gender" onchange="applyFilter()">
    <option value="">성별 전체</option>
    <option value="M">남성</option>
    <option value="F">여성</option>
    <option value="X">미응답</option>
  </select>
  <select class="f-sel" id="f-age" onchange="applyFilter()">
    <option value="">연령 전체</option>
    <option value="10s">10대</option><option value="20s">20대</option>
    <option value="30s">30대</option><option value="40s">40대</option>
    <option value="50s">50대</option><option value="60s">60대+</option>
  </select>
  <select class="f-sel" id="f-mode" onchange="applyFilter()">
    <option value="">검사유형 전체</option>
    <option value="standard">일반형</option>
    <option value="premium">고급형</option>
  </select>
  <button class="f-clear" onclick="clearFilter()">초기화</button>
  <span class="f-count" id="f-count">총 <strong>0</strong>건</span>
</div>

<!-- 테이블 -->
<div class="table-wrap">
  <div class="table-actions">
    <span class="sel-count" id="sel-count">선택 0건</span>
    <button class="act-btn" id="report-btn2" disabled onclick="openBulkReport()">리포트 보기</button>
    <button class="act-btn outline" onclick="exportCSV()">CSV 내보내기</button>
  </div>
  <div id="table-container">
    <div class="loading">URL을 설정하고 데이터를 불러오세요.</div>
  </div>
</div>

<!-- 리포트 패널 -->
<div id="report-panel">
  <div class="rp-hd">
    <h2 id="rp-title">결과 리포트</h2>
    <button class="rp-close" onclick="closeReport()">✕</button>
  </div>
  <div class="rp-body" id="rp-body"></div>
</div>
<div id="overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:199" onclick="closeReport()"></div>

<script>
/* ── 전역 변수 ── */
var MEMBER_GAS_URL = 'https://script.google.com/macros/s/AKfycbzBZMQ55OAWVlw1C_o-9_QIZ3zgVaSEYOW6wIvrJ8cN73jNBIWgv3ATTNE5jBJOjtE4HQ/exec';
var OLD_TSTC_GAS_URL = 'https://script.google.com/macros/s/AKfycbz-F-OU9qpXpmRlqmKfYl5BBBGUDcnmcnAsEFHqgR6Uz0dsBKtz1e8PFi8kNHzrbuJz/exec';
var DEFAULT_TSTC_GAS_URL = 'https://script.google.com/macros/s/AKfycbwbC6MtkfASDi1vSmmOYdAOCpOMHBabno5jpUwFm8tIppntikE2bUqUfi1ITFYoATS0Fw/exec';
var GAS_URL = DEFAULT_TSTC_GAS_URL;
var allData = [];
var filtered = [];
var selected = [];
var startTime = Date.now();

/* ── TSTC 유형 데이터 ── */
var TYPES = {
  RACV:{name:'풍부한 감각형',desc:'맛·향·식감·색 네 가지 감각이 모두 활성화되는 풀패키지 유형입니다.\n달콤하고 향기롭고 아삭하며 선명한 색의 과일에서만 진짜 만족을 경험합니다.\n과일 하나를 고를 때도 색을 먼저 보고, 향을 맡고, 씹는 맛까지 따집니다.\n마트에서 가장 눈에 띄는 과일에 자연스럽게 손이 가는 편입니다.\n딸기·체리·감홍사과처럼 색도 예쁘고 향도 강하고 아삭한 과일이 최고의 선택입니다.\n선물용 과일도 외관과 품질 모두를 중시하며, 포장까지 꼼꼼하게 챙깁니다.',fruits:['딸기 (설향·킹스베리)','체리 (미국산)','사과 (감홍·홍로)','천도복숭아 (천홍)','자두 (대석조생)']},
  RACN:{name:'향미 전통형',desc:'달콤하고 향기롭고 아삭하지만, 화려한 색보다 자연스러운 맛과 향을 더 중시합니다.\n겉이 화려한 과일보다 향기가 좋고 맛이 진한 과일에서 더 큰 만족을 얻습니다.\n샤인머스캣처럼 연한 색이어도 맛이 극강이면 최고로 치는 타입입니다.\n과일 본연의 품질을 알아보는 안목이 있으며, 당도 정보에 관심이 많습니다.\n직거래나 산지 직배송 과일에 관심을 가지는 경향이 있습니다.\n향기로운 과일을 선물받으면 가장 기뻐하는 스타일입니다.',fruits:['샤인머스캣','사과 (부사·후지)','신비복숭아','배 (원황)','코튼캔디 포도']},
  RASV:{name:'감각 탐험형',desc:'달콤하고 향기로우며 부드러운 식감에 선명한 색의 과일을 두루 즐깁니다.\n새로 나온 과일이나 수입 희귀 과일에 먼저 눈이 가는 탐험가 기질이 있습니다.\n한라봉·천혜향·애플망고처럼 향과 비주얼이 모두 강한 과일을 특히 좋아합니다.\n계절마다 새로운 과일을 시도해보는 것을 즐깁니다.\n온라인 과일 구독 서비스나 프리미엄 과일 큐레이션에 매력을 느낍니다.\n주변 사람들에게 좋은 과일을 추천해주는 역할을 자주 합니다.',fruits:['망고 (애플망고)','한라봉·천혜향','황도복숭아','거봉 포도','키위 골드']},
  RASN:{name:'균형 심화형',desc:'달콤하고 향기로우며 부드럽지만, 색보다는 맛과 향 자체에 집중하는 유형입니다.\n백도복숭아처럼 겉은 소박해도 향기와 부드러움이 극강인 과일을 진심으로 좋아합니다.\n과일을 먹을 때 향기에서 오는 기억과 감정에 민감하게 반응합니다.\n제철 과일을 제 시기에 맛있게 먹는 것이 가장 큰 과일 행복이라고 생각합니다.\n바나나·멜론처럼 향기롭고 부드러운 과일은 언제나 기분 좋게 먹을 수 있습니다.\n과일 선물을 받을 때 포장보다 향기와 신선도에 더 집중합니다.',fruits:['백도복숭아 (미백도·백향)','바나나','머스크멜론','리치','무화과']},
  RPCV:{name:'직관 비주얼형',desc:'달콤하고 색이 선명한 과일에 자연스럽게 끌리는 직관적인 유형입니다.\n향이 약해도 맛있고 색깔 예쁜 과일이라면 충분히 만족스럽습니다.\n수박·딸기·포도처럼 먹으면 시원하고 달콤한 과일이 가장 편안한 선택입니다.\n마트에서 잘 진열된 과일 코너를 보면 자연스럽게 구매하게 됩니다.\n과일을 복잡하게 고르기보다는 눈에 들어오는 것을 직관적으로 선택하는 편입니다.\n여름철 시원한 수박이나 냉장 보관한 포도를 특히 즐깁니다.',fruits:['수박 (소형·씨없는)','홍주씨들리스 포도','레드글로브','딸기 (금실)','크림슨 시들리스']},
  RPCN:{name:'맛 현실형',desc:'달콤하기만 하면 충분하다는 실용적인 과일 소비자 유형입니다.\n향이 강하거나 색이 화려하지 않아도 맛있으면 그만이라는 생각을 가지고 있습니다.\n사과·배·단감처럼 언제 먹어도 실패 없고 아삭한 과일을 선호합니다.\n과일 구매 시 당도와 신선도를 중심으로 판단하며, 브랜드나 포장에는 덜 집중합니다.\n제철 과일을 합리적인 가격에 구매하는 것에서 만족감을 얻습니다.\n가족이 함께 먹을 수 있는 대용량 과일을 선호하는 경향이 있습니다.',fruits:['사과 (양광·부사)','단감 (부유)','배 (원황)','수박','포도 (캠벨·거봉)']},
  RPSV:{name:'감성 고급형',desc:'달콤하고 색이 선명하며 부드러운 식감을 좋아하는 감성적인 유형입니다.\n홍시·레드향처럼 눈에 띄게 선명하고 달콤하면서 입에서 녹는 과일을 특히 좋아합니다.\n과일을 단순한 먹거리보다 감성적인 경험으로 받아들이는 경향이 있습니다.\n고급 과일 선물세트나 예쁘게 포장된 과일 바구니에 매력을 느낍니다.\n과일을 먹을 때의 분위기와 상황을 중요하게 여기는 편입니다.\n망고스틴·람부탄처럼 이국적이고 감각적인 과일에도 관심이 높습니다.',fruits:['홍시·연시','레드향','망고스틴','람부탄','황도복숭아']},

  MASN:{name:'에너지 균형형',desc:'담백하고 향기롭고 부드럽지만, 색은 자연스러운 것을 선호하는 균형 잡힌 유형입니다.\n키위·구아바처럼 영양이 풍부하고 향기도 좋은 과일을 꾸준히 챙겨 드십니다.\n과일 섭취를 통해 에너지 보충과 건강 유지를 동시에 추구합니다.\n겉모습보다 영양 성분과 맛의 균형을 더 중요하게 생각합니다.\n운동 전후나 활동이 많은 날 과일을 챙겨 먹는 습관을 가지고 있습니다.\n새로운 건강 과일에 관심이 많으며, 기능성 과일 정보를 꾸준히 수집합니다.',fruits:['키위 그린','창방조생 복숭아','구아바','아보카도','바나나 (덜 숙성)']},
  MPCV:{name:'경쾌 시각형',desc:'담백하고 색이 선명하지만 향은 없어도 되고 아삭한 식감을 즐기는 유형입니다.\n수박·블루베리처럼 시원하고 시각적으로 매력적인 과일을 즐겨 먹습니다.\n과일을 먹을 때 청량감과 아삭한 식감에서 큰 즐거움을 느낍니다.\n복잡한 맛보다는 깔끔하고 단순한 맛을 선호하는 편입니다.\n여름철 냉장 보관한 과일을 먹는 것을 특히 좋아합니다.\n항산화 성분이 풍부한 베리류에 건강적 관심을 가지는 경향이 있습니다.',fruits:['수박','블루베리','아로니아','석류','레드글로브 포도']},
  MPCN:{name:'미니멀 이성형',desc:'과장 없이 담백하고 단순한 과일을 선호하는 이성적인 유형입니다.\n신고배·아보카도처럼 꾸밈없고 본질에 충실한 과일에서 만족을 얻습니다.\n과일 선택이 매우 합리적이며, 필요한 것만 구매하는 경향이 있습니다.\n과도하게 달거나 향이 강한 과일보다는 깔끔하고 부담 없는 과일을 선호합니다.\n과일의 영양 성분이나 칼로리 정보를 비교적 꼼꼼하게 확인하는 편입니다.\n정기 구매보다는 필요할 때 적당량만 구매하는 소비 패턴을 보입니다.',fruits:['신고배','청포도 (청수)','아보카도','황금배','은천멜론']},
  MPSV:{name:'독립 개성형',desc:'담백하고 부드러우며 선명한 색에 끌리는, 독특한 취향을 가진 유형입니다.\n드래곤프루츠·오디처럼 독특하고 눈에 띄는 과일에서 특별한 매력을 느낍니다.\n일반적인 과일보다는 덜 알려진 과일을 시도해보는 것을 즐깁니다.\n과일의 외관에서 흥미로움을 느끼며, 예쁜 색이 선택에 큰 영향을 미칩니다.\n단맛보다는 개성 있는 맛과 시각적 매력을 더 중요하게 생각합니다.\n새로 나온 특이한 과일이 있으면 가장 먼저 먹어보고 싶어하는 편입니다.',fruits:['용과 (드래곤프루츠)','오디','홍시 (연시)','오텀로얄 포도','블랙시들리스']},
  MPSN:{name:'내면 가치형',desc:'겉모습보다 내면의 영양가와 진정한 가치를 중시하는 신중한 유형입니다.\n아보카도·코코넛처럼 겉은 평범해 보여도 영양이 풍부한 과일의 가치를 알아봅니다.\n화려한 포장이나 예쁜 외관보다는 실제 건강에 도움이 되는지를 더 중요하게 생각합니다.\n과일을 통해 진정한 건강과 영양을 추구하는 라이프스타일을 가지고 있습니다.\n과일 선택에 신중하며, 한번 좋다고 판단한 과일은 꾸준히 반복 구매하는 편입니다.\n건강 정보에 관심이 많으며, 과일 섭취를 생활 루틴으로 정착시키는 경향이 있습니다.',fruits:['아보카도','코코넛','구아바','바나나','모과 (차)']}
};

var genderMap={M:'남성',F:'여성',X:'미응답'};
var ageMap={'10s':'10대','20s':'20대','30s':'30대','40s':'40대','50s':'50대','60s':'60대+'};
var regionMap={capital:'수도권',metro:'광역시',small:'중소도시',rural:'농촌'};
var freqMap={high:'주3회+',mid:'주1-2회',low:'월2-3회',rare:'가끔'};
var chMap={online:'온라인',mart:'대형마트',market:'전통시장',convenience:'편의점',direct:'직거래'};

/* ── 초기화 ── */
window.onload = function(){
  var saved = localStorage.getItem('kfa_gas_url');
  GAS_URL = saved && saved !== MEMBER_GAS_URL && saved !== OLD_TSTC_GAS_URL ? saved : DEFAULT_TSTC_GAS_URL;
  if (saved === MEMBER_GAS_URL || saved === OLD_TSTC_GAS_URL) localStorage.setItem('kfa_gas_url', DEFAULT_TSTC_GAS_URL);
  document.getElementById('gas-url-input').value = GAS_URL;
  checkUrl();
  loadData();
};

/* ── URL 관리 ── */
function checkUrl(){
  var v = document.getElementById('gas-url-input').value.trim();
  var banner = document.getElementById('url-banner');
  banner.className = v.includes('script.google.com') ? 'url-banner ok' : 'url-banner';
}
function saveUrl(){
  var v = document.getElementById('gas-url-input').value.trim();
  if(!v){ alert('URL을 입력해주세요.'); return; }
  if(v === MEMBER_GAS_URL){
    alert('회원 Apps Script URL입니다. TSTC 결과용 Apps Script URL을 넣어주세요.');
    v = DEFAULT_TSTC_GAS_URL;
    document.getElementById('gas-url-input').value = v;
  }
  GAS_URL = v;
  localStorage.setItem('kfa_gas_url', v);
  checkUrl();
  loadData();
}

/* ── 데이터 로드 ── */
function loadData(){
  if(!GAS_URL){ document.getElementById('table-container').innerHTML='<div class="empty">Apps Script URL을 먼저 설정해주세요.</div>'; return; }
  document.getElementById('table-container').innerHTML='<div class="loading">데이터를 불러오는 중...</div>';
  fetch(GAS_URL+'?t='+Date.now())
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.status==='ok'){ allData=res.data||[]; applyFilter(); updateStats(); }
      else{ document.getElementById('table-container').innerHTML='<div class="empty">오류: '+res.message+'</div>'; }
    })
    .catch(function(e){ document.getElementById('table-container').innerHTML='<div class="empty">연결 실패. URL을 확인해주세요.<br>'+e.message+'</div>'; });
}

/* ── 통계 업데이트 ── */
function updateStats(){
  document.getElementById('st-total').textContent = allData.length;
  var today = new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\. /g,'-').replace(/\.$/,'');
  document.getElementById('st-today-date').textContent = today;
  var todayCnt = allData.filter(function(r){return (r['타임스탬프']||'').substring(0,10)===today.substring(0,10);}).length;
  document.getElementById('st-today').textContent = todayCnt;
  // 최다 유형
  var codeCnt={};
  allData.forEach(function(r){var c=r['TSTC코드']||'';if(c)codeCnt[c]=(codeCnt[c]||0)+1;});
  var topCode='',topN=0;
  Object.keys(codeCnt).forEach(function(c){if(codeCnt[c]>topN){topN=codeCnt[c];topCode=c;}});
  document.getElementById('st-top-code').textContent = topCode||'-';
  document.getElementById('st-top-name').textContent = topCode?(TYPES[topCode]||{name:''}).name:'';
  // 고급형 비율
  var prem = allData.filter(function(r){return r['검사유형']==='premium';}).length;
  var pct = allData.length ? Math.round(prem/allData.length*100)+'%' : '-';
  document.getElementById('st-premium').textContent = pct;
}

/* ── 필터 적용 ── */
function applyFilter(){
  var fc=document.getElementById('f-code').value;
  var fg=document.getElementById('f-gender').value;
  var fa=document.getElementById('f-age').value;
  var fm=document.getElementById('f-mode').value;
  filtered=allData.filter(function(r){
    if(fc&&r['TSTC코드']!==fc)return false;
    if(fg&&r['성별']!==fg)return false;
    if(fa&&r['연령']!==fa)return false;
    if(fm&&r['검사유형']!==fm)return false;
    return true;
  });
  document.getElementById('f-count').innerHTML='총 <strong>'+filtered.length+'</strong>건';
  selected=[];
  renderTable();
}
function clearFilter(){
  ['f-code','f-gender','f-age','f-mode'].forEach(function(id){document.getElementById(id).selectedIndex=0;});
  applyFilter();
}

/* ── 테이블 렌더링 ── */
function renderTable(){
  if(!filtered.length){ document.getElementById('table-container').innerHTML='<div class="empty">해당하는 데이터가 없습니다.</div>'; return; }
  var h='<table class="tbl"><thead><tr>'
    +'<th><input type="checkbox" id="chk-all" onchange="toggleAll(this)"></th>'
    +'<th>타임스탬프</th><th>참여코드</th><th>검사유형</th>'
    +'<th>TSTC</th><th>유형명</th>'
    +'<th>성별</th><th>연령</th><th>지역</th>'
    +'<th>T</th><th>S</th><th>TX</th><th>C</th>'
    +'<th>리포트</th>'
    +'</tr></thead><tbody>';
  filtered.forEach(function(r,i){
    var isSel=selected.indexOf(i)>=0;
    h+='<tr class="'+(isSel?'selected':'')+'">'
      +'<td><input type="checkbox" '+(isSel?'checked':'')+' onchange="toggleRow('+i+',this)"></td>'
      +'<td>'+((r['타임스탬프']||'').substring(0,16)||'-')+'</td>'
      +'<td>'+((r['참여코드']||'').substring(0,8)||'-')+'</td>'
      +'<td>'+(r['검사유형']==='premium'?'<span style="color:var(--gd);font-weight:700">고급형</span>':'일반형')+'</td>'
      +'<td><span class="code-badge">'+(r['TSTC코드']||'-')+'</span></td>'
      +'<td class="type-badge">'+(r['유형명']||'-')+'</td>'
      +'<td>'+(genderMap[r['성별']]||r['성별']||'-')+'</td>'
      +'<td>'+(ageMap[r['연령']]||r['연령']||'-')+'</td>'
      +'<td>'+(regionMap[r['지역']]||r['지역']||'-')+'</td>'
      +'<td style="text-align:center;font-weight:700;color:'+(r['T점수']>0?'var(--g)':'#888')+'">'+(r['T점수']||0)+'</td>'
      +'<td style="text-align:center;font-weight:700;color:'+(r['S점수']>0?'var(--g)':'#888')+'">'+(r['S점수']||0)+'</td>'
      +'<td style="text-align:center;font-weight:700;color:'+(r['TX점수']>0?'var(--g)':'#888')+'">'+(r['TX점수']||0)+'</td>'
      +'<td style="text-align:center;font-weight:700;color:'+(r['C점수']>0?'var(--g)':'#888')+'">'+(r['C점수']||0)+'</td>'
      +'<td><button class="view-btn" onclick="openReport('+i+')">보기</button></td>'
      +'</tr>';
  });
  h+='</tbody></table>';
  document.getElementById('table-container').innerHTML=h;
  updateSelCount();
}

/* ── 체크박스 ── */
function toggleAll(cb){
  if(cb.checked){ selected=filtered.map(function(_,i){return i;}); }
  else{ selected=[]; }
  renderTable();
}
function toggleRow(i,cb){
  var pos=selected.indexOf(i);
  if(cb.checked&&pos<0)selected.push(i);
  else if(!cb.checked&&pos>=0)selected.splice(pos,1);
  document.querySelectorAll('.tbl tbody tr')[i].className=cb.checked?'selected':'';
  updateSelCount();
}
function updateSelCount(){
  document.getElementById('sel-count').textContent='선택 '+selected.length+'건';
  var dis=selected.length===0;
  document.getElementById('report-btn').disabled=dis;
  document.getElementById('report-btn2').disabled=dis;
}

/* ── 레이더 차트 SVG ── */
function radarSVG(t,s,tx,c,mx){
  mx=mx||10;
  var cx=100,cy=100,r=72;
  // 4개 축 위치 (상·우·하·좌)
  var axes=[
    {label:'T',x:cx,y:cy-r},       // 위
    {label:'S',x:cx+r,y:cy},       // 오른쪽
    {label:'TX',x:cx,y:cy+r},      // 아래
    {label:'C',x:cx-r,y:cy}        // 왼쪽
  ];
  var scores=[t,s,tx,c];
  var pts=scores.map(function(v,i){
    var norm=Math.max(0,Math.min(1,(v+mx)/(mx*2)));
    var ax=axes[i];
    var dx=ax.x-cx, dy=ax.y-cy;
    return {x:cx+dx*norm, y:cy+dy*norm};
  });
  var poly=pts.map(function(p){return p.x+','+p.y;}).join(' ');
  var grid='';
  [0.25,0.5,0.75,1].forEach(function(f){
    var gpts=axes.map(function(a){
      return (cx+(a.x-cx)*f)+','+(cy+(a.y-cy)*f);
    });
    grid+='<polygon points="'+gpts.join(' ')+'" fill="none" stroke="#e0e0e0" stroke-width="1"/>';
  });
  var axLines=axes.map(function(a){
    return '<line x1="'+cx+'" y1="'+cy+'" x2="'+a.x+'" y2="'+a.y+'" stroke="#e0e0e0" stroke-width="1"/>';
  }).join('');
  var labels=axes.map(function(a,i){
    var lx=cx+(a.x-cx)*1.18, ly=cy+(a.y-cy)*1.18;
    var dir=scores[i]>0?['R','A','C','V'][i]:['M','P','S','N'][i];
    return '<text x="'+lx+'" y="'+ly+'" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="'+(scores[i]>0?'#1B3A2D':'#888')+'">'+dir+'</text>';
  }).join('');
  var centerDot='<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="#ccc"/>';
  return '<svg width="200" height="200" viewBox="0 0 200 200">'
    +grid+axLines+centerDot
    +'<polygon points="'+poly+'" fill="rgba(27,58,45,0.15)" stroke="#1B3A2D" stroke-width="2"/>'
    +pts.map(function(p){return '<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="#1B3A2D"/>';}).join('')
    +labels
    +'</svg>';
}

/* ── 단일 리포트 열기 ── */

  if(r['가족구성'])chips.push(r['가족구성']);

    {n:'C · 색', dir:(c>0?'Vivid (선명·강렬)':'Natural (자연스러운색)'), pct:Math.min(100,Math.round(Math.abs(c)/mx*100))},

    // 레이더 차트
    +'<div class="rp-sec">'
    +'<div class="rp-sec-title">TSTC 감각 레이더</div>'
    +'<div class="radar-wrap">'+radarSVG(t,s,tx,c,mx)+'</div>'
    +'<div class="axis-labels">'
    +'<div class="ax-chip"><span class="ax-key">T · 맛</span><div style="text-align:right"><div class="ax-dir">'+(t>0?'Rich':'Mild')+'</div><div class="ax-val">'+t+' pt</div></div></div>'
    +'<div class="ax-chip"><span class="ax-key">S · 향</span><div style="text-align:right"><div class="ax-dir">'+(s>0?'Aroma':'Plain')+'</div><div class="ax-val">'+s+' pt</div></div></div>'
    +'<div class="ax-chip"><span class="ax-key">TX · 식감</span><div style="text-align:right"><div class="ax-dir">'+(tx>0?'Crisp':'Soft')+'</div><div class="ax-val">'+tx+' pt</div></div></div>'

    +'</div></div>'
    // 강도 바 차트
    +'<div class="rp-sec"><div class="rp-sec-title">감각 강도 분석</div>'+barsHTML+'</div>'
    // 유형 설명

/* ── 복수 선택 리포트 ── */
function openBulkReport(){
  if(!selected.length){alert('리포트를 볼 항목을 선택해주세요.');return;}
  if(selected.length===1){openReport(selected[0]);return;}

  var rows=selected.map(function(i){return filtered[i];});
  document.getElementById('rp-title').textContent='복수 리포트 · '+rows.length+'명';

  // 집계
  var codeCnt={},typeCnt={};
  var tSum=0,sSum=0,txSum=0,cSum=0;
  rows.forEach(function(r){
    var c=r['TSTC코드']||'';
    codeCnt[c]=(codeCnt[c]||0)+1;
    tSum+=parseInt(r['T점수'])||0;
    sSum+=parseInt(r['S점수'])||0;
    txSum+=parseInt(r['TX점수'])||0;
    cSum+=parseInt(r['C점수'])||0;
  });
  var n=rows.length;
  var tAvg=Math.round(tSum/n), sAvg=Math.round(sSum/n);
  var txAvg=Math.round(txSum/n), cAvg=Math.round(cSum/n);
  var topCode=Object.keys(codeCnt).sort(function(a,b){return codeCnt[b]-codeCnt[a];})[0]||'';
  var mx=10;

  var codeList=Object.keys(codeCnt).sort(function(a,b){return codeCnt[b]-codeCnt[a];})
    .map(function(c){return '<div class="bulk-row"><span class="bl">'+c+'</span><span class="bv">'+codeCnt[c]+'명 ('+Math.round(codeCnt[c]/n*100)+'%)</span></div>';}).join('');

  var bars2=[
    {n:'T · 맛', dir:(tAvg>0?'Rich 경향':'Mild 경향'), pct:Math.min(100,Math.round(Math.abs(tAvg)/mx*100))},
    {n:'S · 향', dir:(sAvg>0?'Aroma 경향':'Plain 경향'), pct:Math.min(100,Math.round(Math.abs(sAvg)/mx*100))},
    {n:'TX · 식감', dir:(txAvg>0?'Crisp 경향':'Soft 경향'), pct:Math.min(100,Math.round(Math.abs(txAvg)/mx*100))},
    {n:'C · 색', dir:(cAvg>0?'Vivid 경향':'Natural 경향'), pct:Math.min(100,Math.round(Math.abs(cAvg)/mx*100))},
  ].map(function(b){
    return '<div class="bar-item">'
      +'<div class="bar-top"><span class="bar-name">'+b.n+'</span><span class="bar-pct">'+b.dir+' · '+b.pct+'%</span></div>'
      +'<div class="bar-bg"><div class="bar-fill" data-w="'+b.pct+'" style="width:0%"></div></div></div>';
  }).join('');

  document.getElementById('rp-body').innerHTML=
    '<div style="text-align:center;background:var(--lc);border:1px solid var(--bd);padding:16px;margin-bottom:20px">'
    +'<div style="font-size:10px;color:var(--g2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px">분석 대상</div>'
    +'<div style="font-size:36px;font-weight:800;color:var(--g);line-height:1">'+n+'<span style="font-size:16px">명</span></div>'
    +'</div>'
    +'<div class="rp-sec"><div class="rp-sec-title">평균 감각 레이더</div>'
    +'<div class="radar-wrap">'+radarSVG(tAvg,sAvg,txAvg,cAvg,mx)+'</div></div>'
    +'<div class="rp-sec"><div class="rp-sec-title">평균 감각 강도</div>'+bars2+'</div>'
    +'<div class="rp-sec"><div class="rp-sec-title">TSTC 유형 분포</div>'
    +'<div class="bulk-stat">'+codeList+'</div></div>'
    +'<div class="rp-sec"><div class="rp-sec-title">최다 유형 상세</div>'
    +'<div class="rp-code" style="font-size:40px">'+topCode+'</div>'
    +'<div class="rp-type" style="font-size:14px;margin-bottom:16px">'+((TYPES[topCode]||{name:''}).name)+'</div>'
    +'<div class="desc-text">'+((TYPES[topCode]||{desc:''}).desc||'').replace(/\n/g,'\n')+'</div>'
    +'</div>'
    +'<button onclick="printReport()" style="width:100%;background:var(--g);color:#fff;border:none;padding:14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px">인쇄 / PDF 저장</button>';

  document.getElementById('report-panel').classList.add('open');
  document.getElementById('overlay').style.display='block';
  setTimeout(function(){
    document.querySelectorAll('#rp-body .bar-fill').forEach(function(el){
      el.style.width=(el.dataset.w||'0')+'%';
    });
  },200);
}

/* ── CSV 내보내기 ── */
function exportCSV(){
  if(!filtered.length){alert('내보낼 데이터가 없습니다.');return;}
  var cols=['타임스탬프','참여코드','검사유형','성별','연령','지역','가족구성','자녀연령','구매빈도','구매채널','T점수','S점수','TX점수','C점수','TSTC코드','유형명'];
  var csv='\uFEFF'+cols.join(',')+'\n';
  filtered.forEach(function(r){
    csv+=cols.map(function(c){
      var v=r[c]||'';
      if(typeof v==='string'&&(v.includes(',')||v.includes('"')))v='"'+v.replace(/"/g,'""')+'"';
      return v;
    }).join(',')+'\n';
  });
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='KFA_TSTC_결과_'+new Date().toISOString().substring(0,10)+'.csv';
  a.click();
}
