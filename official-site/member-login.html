<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인 · 대한과일협회</title>
  <link rel="stylesheet" href="member-style.css" />
</head>
<body>
  <nav class="m-nav">
    <div class="m-nav__inner">
      <a class="m-nav__brand" href="index.html"><span>대한과일협회</span><span class="m-nav__brand-en">KFA</span></a>
      <div class="m-nav__crumbs"><a href="index.html">홈</a><span class="sep">›</span><span>회원</span><span class="sep">›</span><span>로그인</span></div>
      <div class="m-nav__util"><a href="member-login.html" class="is-active">로그인</a><a href="member-join.html">회원가입</a><a href="member-mypage.html">마이페이지</a><a href="member-admin.html">운영</a></div>
    </div>
  </nav>

  <main class="m-page">
    <div style="max-width: 480px; width: 100%;">
      <div class="m-head">
        <p class="m-head__eyebrow">KFA MEMBER</p>
        <h1>다시 오셨네요.</h1>
        <p class="m-head__lead">승인된 회원은 교육과 회원 정보를 확인할 수 있습니다.</p>
      </div>

      <section class="m-card m-card--narrow">
        <div class="config-box">
          <label for="gas-url">Apps Script 배포 URL</label>
          <input id="gas-url" type="url" />
          <button id="save-gas-url" type="button">저장</button>
          <div id="config-msg" class="msg"></div>
        </div>

        <form id="login-form" class="m-form" autocomplete="on">
          <div class="m-field">
            <label>이메일</label>
            <input name="email" type="email" autocomplete="email" required />
          </div>
          <div class="m-field">
            <label>비밀번호</label>
            <input name="password" type="password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="m-btn m-btn--primary">로그인</button>
        </form>
        <div id="login-msg" class="msg"></div>
      </section>

      <div class="m-links">
        <a href="member-join.html">회원가입 신청</a>
        <a href="index.html">홈으로</a>
      </div>
    </div>
  </main>

  <script src="assets/kfa-member.js"></script>
</body>
</html>
